<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วิทยาการคำนวณ ว21032 | ทำความรู้จัก AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<!-- model-viewer เวอร์ชันที่ใช้: 3.5.0 (ไลบรารีทางการจาก Google CDN) -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
:root{--navy:#1f3a68;--navy2:#33568f;--slate:#475569;--ink:#1e293b;--mut:#64748b;--bg:#fff;--soft:#f1f5f9;--soft2:#e6edf6;--line:#d5dde8;
--ok:#3f7d5a;--okbg:#eaf3ee;--bad:#a4534b;--badbg:#f7ecea;--c1:#3b6ea5;--c2:#3f8f8a;--c3:#b08a3e;--c4:#7a62a8;--c5:#b9674f}
*{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;min-width:320px}
h2,h3,h4{line-height:1.35;color:var(--navy)}h4{margin:18px 0 6px;font-size:1.05rem}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header .t{flex:1;min-width:180px}header .t b{font-size:1.05rem;display:block;line-height:1.3}header .t span{font-size:.8rem;opacity:.85}
header .u{font-size:.85rem;opacity:.95}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap}
button{font:inherit;min-height:44px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:6px 16px;border-radius:12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--navy)}button:disabled{opacity:.5;cursor:not-allowed}
button.p,nav button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
main{max-width:980px;margin:0 auto;padding:12px 14px 56px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.soft{background:var(--soft)}
input,textarea,select{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%;margin:4px 0;min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.mut{color:var(--mut);font-size:.88rem}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:.88rem}th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-weight:600}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}.scroll{overflow-x:auto}
.av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--soft2);border:3px solid var(--soft2)}.av.s{width:36px;height:36px;border-width:1px}
.tag{display:inline-block;background:var(--soft2);color:var(--navy);border-radius:8px;padding:0 8px;font-size:.8rem;font-weight:600}
.ex{border-left:5px solid var(--c3);padding:6px 14px;margin:14px 0;background:#faf6ec;border-radius:0 12px 12px 0}
.tnote{border:1px dashed var(--slate);padding:8px 14px;margin:12px 0;background:var(--soft);border-radius:10px;font-size:.9rem}
pre{background:var(--soft);border:1px solid var(--line);padding:10px;overflow-x:auto;font-size:.8rem;border-radius:10px}
figure{margin:14px 0;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px}figure svg{width:100%;height:auto;max-width:460px;display:block;margin:0 auto}
figcaption{font-size:.85rem;color:var(--slate);margin-top:6px}
model-viewer{width:100%;height:340px;background:var(--soft);border-radius:14px;--poster-color:transparent}
.arbtn{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-color:var(--navy)}
/* หน้าเข้าสู่ระบบ + หน้าตั้งค่า */
#login{max-width:430px;margin:22px auto;padding:0;overflow:hidden}#login .in{padding:18px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:22px 20px;position:relative;overflow:hidden;margin:6px 0 14px}
.hero h2{color:#fff;margin:0 0 6px}.hero p{margin:4px 0;opacity:.95}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{content:"";position:absolute;right:50px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.06)}
.hero .em{font-size:2.6rem;display:inline-block;position:relative;z-index:1}.float{animation:fl 3.2s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}*{scroll-behavior:auto!important}}
.chip{display:inline-block;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 12px;font-size:.82rem;margin:2px 4px 2px 0;position:relative;z-index:1}
.bar{height:14px;background:var(--soft2);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .4s}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:10px 0}
.stop{border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:.85rem;background:#fff;line-height:1.35}
.stop .ic{font-size:1.7rem;display:block}.stop.done{border-color:var(--ok);background:var(--okbg)}.stop.cur{border-color:var(--navy);background:var(--soft2);box-shadow:0 0 0 3px rgba(31,58,104,.15)}.stop.lock{opacity:.6}
.unit{border:1px solid var(--line);border-left:7px solid var(--uc,var(--navy));border-radius:16px;padding:14px;margin:14px 0;background:#fff}
.unit .no{width:38px;height:38px;border-radius:50%;background:var(--uc,var(--navy));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.unit.locked{background:var(--soft);opacity:.85}
.qopt{display:flex;gap:10px;align-items:center;padding:11px 12px;border:2px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:#fff}
.qopt.sel{border-color:var(--navy);background:var(--soft2)}.qopt input{width:auto;min-height:0;margin:0}.qopt .lt{background:var(--soft2);border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:600;font-size:.85rem}
.qopt.right{border-color:var(--ok);background:var(--okbg)}.qopt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin:6px 0;padding:8px 12px;border-radius:10px;font-size:.92rem}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.big{font-size:2.2rem;font-weight:700;color:var(--navy);line-height:1.1}.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:14px;padding:12px;text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:30px;z-index:20;max-width:90vw;text-align:center}
.bars{display:flex;gap:18px;align-items:flex-end;height:120px;margin:10px 0}.bars div{flex:1;background:var(--navy2);border-radius:8px 8px 0 0;color:#fff;text-align:center;min-height:6px;position:relative}.bars div.b2{background:var(--c2)}.bars span{position:absolute;top:-24px;left:0;right:0;color:var(--ink);font-weight:600}
@media (max-width:420px){html{font-size:16px}.hero{padding:18px 16px}}
</style>
</head>

function errTh(e,fb){if(e)console.error(e);const m=(e&&e.message)||'';
 if(THAI.test(m))return m;

 if(e&&(e.code==='42501'||/row-level security|not authorized|permission/i.test(m)))return'ไม่มีสิทธิ์ทำรายการนี้';

function loginUI(m=''){app.innerHTML=`<div class="card" id="login"><div class="hero" style="margin:0;border-radius:0"><span class="em float">🧊</span><h2>${esc(COURSE.name)}</h2>
 <span class="chip">${esc(COURSE.code)}</span><span class="chip">${esc(COURSE.grade)}</span><p>${esc(COURSE.topic)}</p><p style="font-size:.85rem">${esc(COURSE.school)}</p></div>
 <div class="in"><p class="mut">นักเรียน: ใช้เลขประจำตัว ${CFG.idLen} หลัก | ครู: ใช้อีเมล<br>สมัครครั้งแรกให้ตั้งรหัสผ่านที่จำได้ (อย่างน้อย 6 ตัว)</p>

 $('#bin').onclick=()=>auth(false);$('#bup').onclick=()=>auth(true);$('#pw').onkeydown=e=>{if(e.key==='Enter')auth(false)}}
async function auth(up){const id=$('#id').value.trim(),pw=$('#pw').value,stu=idRe.test(id),msg=$('#msg');
 if(!id||pw.length<6){msg.textContent='กรอกข้อมูลให้ครบ (รหัสผ่านอย่างน้อย 6 ตัว)';return}
 if(!stu&&!id.includes('@')){msg.textContent=`เลขประจำตัวนักเรียนต้องเป็นตัวเลข ${CFG.idLen} หลัก`;return}
 const email=stu?`${id}@${CFG.domain}`:id.toLowerCase();msg.textContent='กำลังตรวจสอบ...';
 let r;try{r=up?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw})}catch(e){msg.textContent=errTh(e);return}
 if(r.error){console.error(r.error);msg.textContent=(r.error.status===429||/fetch|network/i.test(r.error.message||''))?errTh(r.error):(up?'สมัครไม่ได้: เลขประจำตัวไม่อยู่ในรายชื่อ หรือถูกใช้สมัครแล้ว (ถ้าเคยสมัครแล้ว ให้กดเข้าสู่ระบบ)':'เข้าสู่ระบบไม่ได้: เลขประจำตัวหรือรหัสผ่านไม่ถูกต้อง');return}
 if(!r.data.session){msg.textContent='ยังเข้าระบบไม่ได้: แจ้งครูตรวจว่าปิด Confirm email ใน Supabase แล้ว';return}
 boot()}
async function boot(){let session;try{({data:{session}}=await sb.auth.getSession())}catch(e){return loginUI(errTh(e))}
 if(!session)return loginUI();const uid=session.user.id;
 try{const t=await sb.from('teachers').select('user_id').eq('user_id',uid).maybeSingle();
 if(t.data){me={uid,role:'teacher',name:session.user.email};view='results';return shell()}
 const s=await sb.from('students').select('*').eq('user_id',uid).maybeSingle();
 if(s.data){me={uid,role:'student',st:s.data,name:`${s.data.title||''}${s.data.first_name} ${s.data.last_name}`};view='home';return shell()}}catch(e){console.error(e)}
 await sb.auth.signOut();loginUI('บัญชีนี้ยังไม่ได้รับสิทธิ์ (ถ้าเป็นครู ต้องรันคำสั่งตั้งผู้สอนใน setup.sql ก่อน)')}

 if(a.error)throw a.error;if(p.error)throw p.error;

  :[['home','🏠 แนะนำ'],['test','📝 ทดสอบ'],['units','📚 บทเรียน'],['summary','📊 สรุปผล'],['mats','🎁 สื่อเพิ่มเติม'],['profile','🙂 โปรไฟล์']];

 app.innerHTML=`<header><div class="t"><b>${esc(COURSE.name)} (${esc(COURSE.code)})</b><span>${esc(COURSE.school)}</span></div><span class="u">${esc(me.name)}${T()?' (ครู)':''}</span><button id="out">ออกจากระบบ</button></header>

 try{if(!T())await loadState();await V[view]()}catch(e){main(`<p class="bad">${esc(errTh(e,'โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า'))}</p>`)}}

function nextStep(){if(!ST.att.pre)return{v:'test',t:'ทำแบบทดสอบก่อนเรียน'};for(let i=0;i<5;i++)if(!ST.done.has(i+1))return{v:'units',t:`เรียนหน่วยที่ ${i+1}`};
 if(!ST.att.post)return{v:'test',t:'ทำแบบทดสอบหลังเรียน'};return{v:'summary',t:'ดูสรุปผลของฉัน'}}
function vHome(){const pre=ST.att.pre,post=ST.att.post,n=(pre?1:0)+ST.done.size+(post?1:0),pct=Math.round(n/7*100),nx=nextStep();
 const steps=[{ic:'📝',t:'ก่อนเรียน',ok:!!pre},...UNITS.map((u,i)=>({ic:u.ic,t:`หน่วย ${i+1}`,s:u.t,ok:ST.done.has(i+1)})),{ic:'🏁',t:'หลังเรียน',ok:!!post}];
 const cur=steps.findIndex(s=>!s.ok);
 main(`<div class="hero"><span class="em float">🧊</span><h2>สวัสดี ${esc(me.st.first_name)} 👋</h2><p>ยินดีต้อนรับสู่การเรียนรู้เรื่อง AR ลองดูสิ ภาพเสมือนมาอยู่ในห้องเรียนของเราได้อย่างไร</p>
 <span class="chip">${esc(COURSE.code)}</span><span class="chip">${esc(COURSE.grade)}</span><span class="chip">ใช้เวลาเรียนประมาณ ${TOTAL_MIN} นาที</span></div>
 <div class="card"><b>เส้นทางการเรียนของฉัน</b> <span class="mut">ทำแล้ว ${n} จาก 7 ขั้น</span><div class="bar"><i style="width:${pct}%"></i></div>
 <div class="path">${steps.map((s,i)=>`<div class="stop ${s.ok?'done':i===cur?'cur':'lock'}"><span class="ic">${s.ok?'✅':i===cur?s.ic:'🔒'}</span><b>${s.t}</b>${s.s?`<br><span class="mut">${esc(s.s)}</span>`:''}</div>`).join('')}</div>
 <button class="p" data-go="${nx.v}">▶ ไปต่อ: ${nx.t}</button></div>
 <div class="card soft"><h3>เรียนอย่างไร</h3><ol><li>ทำแบบทดสอบก่อนเรียน (10 ข้อ ทำได้ครั้งเดียว) เพื่อดูว่าตอนนี้เรารู้อะไรแล้วบ้าง</li><li>เรียนหน่วยที่ 1 ถึง 5 ตามลำดับ แต่ละหน่วยมีคำถามแทรก ต้องตอบให้ถูกครบจึงไปหน่วยต่อไปได้ และกลับมาทบทวนได้</li><li>ทำแบบทดสอบหลังเรียน แล้วดูเฉลยและคำอธิบาย</li><li>ดูสรุปผล คะแนนงาน และข้อเสนอแนะจากครู</li></ol>
 <p class="mut">วิชา${esc(COURSE.name)} เรื่อง${esc(COURSE.topic)} ${esc(COURSE.school)} ถ้าติดขัดให้ถามครูได้เสมอ</p></div>`)}

async function vUnits(){const un=i=>T()||(ST.att.pre&&(i===0||ST.done.has(i)));
 main((!T()&&!ST.att.pre?`<div class="card soft">🔒 ทำ<b>แบบทดสอบก่อนเรียน</b>ก่อน จึงจะเริ่มเรียนหน่วยที่ 1 ได้ <button class="p" data-go="test">ไปทำแบบทดสอบ</button></div>`:'')
 +`<p class="mut">5 หน่วย รวมประมาณ ${TOTAL_MIN} นาที</p>`+UNITS.map((u,i)=>{const d=ST.done.has(i+1),open=un(i);
 return `<div class="unit ${open?'':'locked'}" style="--uc:${u.col}"><div class="row"><span class="no">${i+1}</span><div style="flex:1;min-width:150px"><b>${u.ic} ${esc(u.t)}</b><br><span class="mut">ประมาณ ${u.min} นาที</span></div>
 ${T()?'':`<span class="${d?'ok':'mut'}" id="st${i}">${d?'เรียนแล้ว ✓':open?'พร้อมเรียน':'🔒 ยังไม่เปิด'}</span>`}<button data-u="${i}" ${open?'':'disabled'}>${open?'เปิด/ปิด':'🔒'}</button></div><div id="U${i}"></div></div>`}).join(''));
 $$('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u,box=$('#U'+i);if(box.innerHTML){box.innerHTML='';return}openUnit(i)})}
function openUnit(i){const box=$('#U'+i);if(!box||box.innerHTML)return;box.innerHTML=unitHtml(i);wireUnit(i,box);box.scrollIntoView({behavior:'smooth',block:'start'})}
function unitHtml(i){const u=UNITS[i];
 return `<h4>🎯 จุดประสงค์ (เมื่อเรียนจบ นักเรียนสามารถ)</h4><ul>${u.obj.map(([id,t])=>`<li><span class="tag">${id}</span> ${esc(t)}</li>`).join('')}</ul>`
 +u.secs.map(s=>`<h4>${esc(s.h)}</h4>${para(s.p)}${s.f?figHtml(s.f):''}`).join('')
 +`<div class="ex">${para(u.ex)}</div>`+(T()&&u.tn?`<div class="tnote"><b>สำหรับครู:</b> ${esc(u.tn)}</div>`:'')+(i===3?practiceHtml():'')
 +`<h4>❓ คำถามแทรก</h4>`+u.qs.map((q,k)=>`<div class="card soft"><b>${k+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label class="qopt"><input type="radio" name="u${i}q${k}" data-k="${k}" value="${j}"><span class="lt">${'กขคง'[j]}</span><span>${esc(o)}</span></label>`).join('')}<div id="fb${i}_${k}"></div></div>`).join('')
 +(T()?'':`<button class="p" id="dn${i}">✅ ฉันเรียนหน่วยนี้แล้ว</button> <span class="mut" id="dm${i}"></span>`)}
function wireUnit(i,box){const u=UNITS[i],dn=$('#dn'+i),msg=$('#dm'+i);
 const ready=()=>u.qs.every((q,k)=>{const c=box.querySelector(`input[name=u${i}q${k}]:checked`);return c&&+c.value===q.a});
 const refresh=()=>{if(!dn)return;if(ST.done.has(i+1)){dn.disabled=true;dn.textContent='เรียนแล้ว ✓';msg.textContent='';return}const ok=ready();dn.disabled=!ok;msg.textContent=ok?'':'ตอบคำถามแทรกให้ถูกครบทุกข้อ ปุ่มนี้จึงจะกดได้'};
 box.querySelectorAll('input[type=radio][data-k]').forEach(r=>r.onchange=()=>{const k=+r.dataset.k,q=u.qs[k],ok=+r.value===q.a;
  box.querySelectorAll(`input[name=u${i}q${k}]`).forEach(x=>x.closest('.qopt').classList.toggle('sel',x.checked));
  $(`#fb${i}_${k}`).innerHTML=`<div class="fb ${ok?'ok':'bad'}">${ok?'✓ <b>ถูกต้อง!</b> '+esc(q.why):'💡 <b>ลองคิดอีกครั้ง</b> '+esc(q.h)}</div>`;refresh()});
 if(dn)dn.onclick=async()=>{dn.disabled=true;let r=await sb.from('progress').update({done:true}).eq('user_id',me.uid).eq('unit',i+1).select();
  if(!r.error&&!(r.data||[]).length)r=await sb.from('progress').insert({user_id:me.uid,unit:i+1,done:true});
  if(r.error){msg.textContent=errTh(r.error,'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง');dn.disabled=false;return}
  ST.done.add(i+1);toast(`🎉 เก่งมาก! เรียนหน่วยที่ ${i+1} แล้ว`);await vUnits();if(i<4)openUnit(i+1)};
 refresh();if(i===3)wirePractice(box)}

 $$('[data-t]').forEach(b=>b.onclick=async()=>{const k=b.dataset.t,box=$('#T'+k);b.disabled=true;
  const f=await sb.rpc('test_form',{p_kind:k});if(f.error||!TEST[f.data]){b.disabled=false;box.innerHTML=`<p class="bad">${esc(errTh(f.error,'เริ่มทำข้อสอบไม่ได้ ลองใหม่อีกครั้ง'))}</p>`;return}

function runTest(kind,items,box){let idx=0;const ans=Array(items.length).fill(-1);
 const draw=()=>{const q=items[idx],last=idx===items.length-1;
  box.innerHTML=`<div class="bar"><i style="width:${(idx+1)/items.length*100}%"></i></div><p class="mut">ข้อ ${idx+1} จาก ${items.length}</p><h4 style="margin-top:4px">${esc(q.q)}</h4>`
  +q.o.map((o,j)=>`<label class="qopt ${ans[idx]===j?'sel':''}"><input type="radio" name="tq" value="${j}" ${ans[idx]===j?'checked':''}><span class="lt">${'กขคง'[j]}</span><span>${esc(o)}</span></label>`).join('')
  +`<div class="row"><button id="tp" ${idx?'':'disabled'}>◀ ก่อนหน้า</button>${last?'<button class="p" id="tsub">ส่งคำตอบ</button>':'<button class="p" id="tn">ถัดไป ▶</button>'}</div><p id="tm" class="bad"></p>`;
  box.querySelectorAll('input[name=tq]').forEach(r=>r.onchange=()=>{ans[idx]=+r.value;box.querySelectorAll('.qopt').forEach(l=>l.classList.remove('sel'));r.closest('.qopt').classList.add('sel')});
  $('#tp').onclick=()=>{if(idx>0){idx--;draw()}};
  const tn=$('#tn');if(tn)tn.onclick=()=>{if(ans[idx]<0){$('#tm').textContent='เลือกคำตอบก่อน';return}idx++;draw()};
  const ts=$('#tsub');if(ts)ts.onclick=async()=>{const un=ans.indexOf(-1);if(un>=0){idx=un;draw();$('#tm').textContent='ยังไม่ได้ตอบข้อนี้ ตอบให้ครบทุกข้อก่อนส่ง';return}
   if(!confirm('ส่งแล้วแก้ไขไม่ได้ ยืนยันหรือไม่?'))return;ts.disabled=true;
   const r=await sb.rpc('submit_attempt',{p_kind:kind,p_answers:ans});if(r.error){ts.disabled=false;$('#tm').textContent=errTh(r.error,'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง');return}
   toast(`ส่งแล้ว ได้ ${r.data}/10 คะแนน`);sTest()}};
 draw()}

 if(r.error){btn.disabled=false;box.innerHTML=`<p class="bad">${esc(errTh(r.error,'โหลดเฉลยไม่สำเร็จ'))}</p>`;return}
 const a=ST.att.post,items=TEST[a.form]||[],mine=a.answers||[];

function resizeImg(file,max=512){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('resize')),'image/jpeg',0.85)};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('resize'))};img.src=url})}
